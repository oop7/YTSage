name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for the release (e.g., 1.0.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version name for the release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Get version
      id: get_version
      shell: bash
      run: |
        version="${{ inputs.version || github.event.inputs.version }}"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([A-Za-z][0-9A-Za-z.-]*|[-.][0-9A-Za-z.-]+)?$ ]]; then
          echo "Invalid version '$version'. Expected semantic version format such as 1.2.3 or 1.2.3b2." >&2
          exit 1
        fi
        echo "Extracted version: $version"
        echo "VERSION=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true

    - name: Create virtual environment and install dependencies
      shell: bash
      run: |
        uv venv venv
        source venv/bin/activate
        uv pip install . cx_Freeze

    - name: Prepare build variables
      shell: bash
      run: |
        version="${{ steps.get_version.outputs.VERSION }}"
        echo "VERSION=$version" >> "$GITHUB_ENV"
        arch="$(uname -m)" # arm64 or x86_64
        echo "ARCH=$arch" >> "$GITHUB_ENV"
        if [ "$arch" = "arm64" ]; then
          echo "ARCH_SUFFIX=arm64" >> "$GITHUB_ENV"
        else
          echo "ARCH_SUFFIX=x64" >> "$GITHUB_ENV"
        fi
        echo "Prepared build variables for version: $version on $(uname -a)"

    - name: Build .app bundle (bdist_mac)
      shell: bash
      run: |
        source venv/bin/activate
        python -OO setup-scripts/setup_cxfreeze_macos.py bdist_mac

        app_path="$(find "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/build" -maxdepth 3 -type d -name "YTSage-v${VERSION}.app" -print -quit 2>/dev/null || true)"
        if [ -z "$app_path" ]; then
          echo "Expected app bundle was not found for version $VERSION" >&2
          exit 1
        fi
        app_path="$(cd "$(dirname "$app_path")" && pwd)/$(basename "$app_path")"
        echo "APP_PATH=$app_path" >> "$GITHUB_ENV"
        echo "Found app bundle at: $app_path"
        
    - name: Trim unnecessary files from App bundle
      shell: bash
      run: |
        if [ -z "${APP_PATH:-}" ]; then
          echo "App bundle path is not set." >&2
          exit 1
        fi
        bash setup-scripts/trim-build-macos.sh "$APP_PATH"

    - name: Package and prepare release artifacts (.app.zip and .dmg)
      shell: bash
      run: |
        version="${{ steps.get_version.outputs.VERSION }}"
        echo "Preparing artifacts for version: $version"
        mkdir -p artifacts
        
        if [ -n "${APP_PATH:-}" ] && [ -d "$APP_PATH" ]; then
          app_base="$(basename "$APP_PATH")"
          app_parent="$(dirname "$APP_PATH")"
          
          # Create ZIP
          (cd "$app_parent" && zip -r "${GITHUB_WORKSPACE}/artifacts/YTSage-v${version}-${ARCH_SUFFIX}.app.zip" "$app_base")
          echo "Created: artifacts/YTSage-v${version}-${ARCH_SUFFIX}.app.zip"
          
          # Create DMG (Manual)
          echo "Creating DMG from $APP_PATH..."
          mkdir -p dmg_stage
          cp -R "$APP_PATH" "dmg_stage/"
          ln -s /Applications "dmg_stage/Applications"
          
          hdiutil create -volname "YTSage v${version}" -srcfolder "dmg_stage" -ov -format UDZO "artifacts/YTSage-v${version}-${ARCH_SUFFIX}.dmg"
          echo "Created: artifacts/YTSage-v${version}-${ARCH_SUFFIX}.dmg"
          
          rm -rf dmg_stage
        else
          echo "Error: App bundle path is missing or invalid: ${APP_PATH:-<unset>}" >&2
          exit 1
        fi

        zip_path="artifacts/YTSage-v${version}-${ARCH_SUFFIX}.app.zip"
        dmg_path="artifacts/YTSage-v${version}-${ARCH_SUFFIX}.dmg"
        for artifact in "$zip_path" "$dmg_path"; do
          if [ ! -s "$artifact" ]; then
            echo "Missing or empty artifact: $artifact" >&2
            exit 1
          fi
        done

        echo "Final artifacts:"
        ls -lh "$zip_path" "$dmg_path"

    - name: Create/Update draft release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: YTSage v${{ steps.get_version.outputs.VERSION }}
        draft: true
        prerelease: false
        append_body: true
        fail_on_unmatched_files: true
        body: |
          # YTSage v${{ steps.get_version.outputs.VERSION }}

          **Release Date**: ${{ github.run_started_at }}
        files: |
          artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
