name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for the release (e.g., 1.0.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version name for the release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'
  FFMPEG_URL: 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip'
  FFMPEG_SHA256: '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Get version
      id: get_version
      shell: powershell
      run: |
        $version = "${{ inputs.version || github.event.inputs.version }}"
        if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([a-zA-Z][0-9A-Za-z.-]*|[-.][0-9A-Za-z.-]+)?$') {
          throw "Invalid version '$version'. Expected semantic version format such as 1.2.3 or 1.2.3b2."
        }
        Write-Host "Extracted version: $version"
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: true

    - name: Create virtual environment and install dependencies
      shell: powershell
      run: |
        uv venv venv
        .\venv\Scripts\Activate.ps1
        uv pip install . cx_Freeze

    - name: Prepare build variables
      shell: powershell
      run: |
        $version = "${{ steps.get_version.outputs.VERSION }}"
        echo "VERSION=$version" >> $env:GITHUB_ENV
        Write-Host "Prepared build variables for version: $version"

    - name: Build Standard Version (ZIP)
      shell: powershell
      run: |
        .\venv\Scripts\Activate.ps1
        $version = "$env:VERSION"
        Write-Host "Building Standard Version v$version ..."

        # Clean previous build artifacts
        if (Test-Path "build\exe.*") { Remove-Item "build\exe.*" -Recurse -Force }
        if (Test-Path "build\bdist.*") { Remove-Item "build\bdist.*" -Recurse -Force }
        if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }

        # Build executable using setup script with extra optimization
        python -OO setup-scripts\setup_cxfreeze.py build_exe --build-exe "dist\YTSage"

    - name: Trim Standard build
      shell: powershell
      run: .\setup-scripts\trim-build.ps1 -DistDir "dist\YTSage"

    - name: Setup FFmpeg for bundle
      shell: powershell
      run: |
        Write-Host "Setting up FFmpeg for bundled version..."

        New-Item -ItemType Directory -Path "ffmpeg-temp" -Force
        
    - name: Cache FFmpeg archive
      id: cache-ffmpeg
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ffmpeg-temp\ffmpeg.zip
        key: windows-ffmpeg-${{ env.FFMPEG_SHA256 }}

    - name: Download and verify FFmpeg
      shell: powershell
      run: |
        # Download a pinned archive and verify its published SHA-256 digest.
        $ffmpegUrl = $env:FFMPEG_URL
        $expectedHash = $env:FFMPEG_SHA256
        $ffmpegZipPath = "ffmpeg-temp\ffmpeg.zip"
        if (Test-Path $ffmpegZipPath) {
          Write-Host "Using cached FFmpeg archive."
        } else {
          Write-Host "Downloading FFmpeg from: $ffmpegUrl"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $ffmpegZipPath -ErrorAction Stop
        }
        $actualHash = (Get-FileHash -Path $ffmpegZipPath -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualHash -ne $expectedHash.ToLowerInvariant()) {
          throw "FFmpeg SHA-256 mismatch. Expected $expectedHash, got $actualHash."
        }
        Write-Host "FFmpeg archive checksum verified."

        # Extract FFmpeg
        Expand-Archive -Path $ffmpegZipPath -DestinationPath "ffmpeg-temp" -Force

        # Find the extracted directory (GyanD ffmpeg has specific naming)
        $ffmpegDir = Get-ChildItem -Path "ffmpeg-temp" -Directory | Where-Object { $_.Name -like "ffmpeg-*" } | Select-Object -First 1

        if ($ffmpegDir) {
          # Set environment variable for the build
          $ffmpegBinPath = Join-Path $ffmpegDir.FullName "bin"
          Write-Host "FFmpeg binaries found at: $ffmpegBinPath"
          echo "FFMPEG_PATH=$ffmpegBinPath" >> $env:GITHUB_ENV

          # Verify files exist (only ffmpeg and ffprobe are needed)
          $ffmpegExe = Join-Path $ffmpegBinPath "ffmpeg.exe"
          $ffprobeExe = Join-Path $ffmpegBinPath "ffprobe.exe"

          if (-not (Test-Path $ffmpegExe)) { throw "ffmpeg.exe is missing from the FFmpeg archive." }
          if (-not (Test-Path $ffprobeExe)) { throw "ffprobe.exe is missing from the FFmpeg archive." }
        } else {
          Write-Host "Error: Could not find FFmpeg directory after extraction"
          exit 1
        }

    - name: Build FFmpeg Version (ZIP)
      shell: powershell
      run: |
        .\venv\Scripts\Activate.ps1
        $version = "$env:VERSION"
        Write-Host "Building FFmpeg Version v$version ..."

        # Clean previous build artifacts
        if (Test-Path "build\exe.*") { Remove-Item "build\exe.*" -Recurse -Force }
        if (Test-Path "build\bdist.*") { Remove-Item "build\bdist.*" -Recurse -Force }

        # Build executable with FFmpeg using setup script
        $env:YTSAGE_EXECUTABLE_SUFFIX = "-ffmpeg"
        python -OO setup-scripts\setup_cxfreeze.py build_exe --build-exe "dist\YTSage-FFmpeg"

        # Copy FFmpeg binaries into dist folder post-build (more reliable than CLI include)
        # Note: ffplay.exe is excluded as it's not needed by the application
        if ($env:FFMPEG_PATH) {
          $destDir = "dist\YTSage-FFmpeg"
          $ffmpegExe = Join-Path $env:FFMPEG_PATH "ffmpeg.exe"
          $ffprobeExe = Join-Path $env:FFMPEG_PATH "ffprobe.exe"

          foreach ($file in @($ffmpegExe, $ffprobeExe)) {
            if (Test-Path $file) {
              $name = Split-Path $file -Leaf
              Copy-Item $file -Destination (Join-Path $destDir $name) -Force
              Write-Host "Copied $name into $destDir"
            } else {
              throw "FFmpeg binary not found: $file"
            }
          }
        }

    - name: Trim FFmpeg build
      shell: powershell
      run: .\setup-scripts\trim-build.ps1 -DistDir "dist\YTSage-FFmpeg"

    - name: Package and prepare release artifacts (ZIPs)
      shell: powershell
      run: |
        $version = "${{ steps.get_version.outputs.VERSION }}"

        Write-Host "Preparing ZIP artifacts for version: $version"
        New-Item -ItemType Directory -Path "artifacts" -Force

        # List dist directories
        Write-Host "Files in dist directory:"
        if (Test-Path "dist") {
          Get-ChildItem -Path "dist" -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
        } else {
          Write-Host "  No dist directory found!"
          exit 1
        }

        # Create Standard ZIP
        $standardDist = Join-Path (Get-Location) "dist\YTSage"
        if (Test-Path $standardDist) {
          $standardExe = Join-Path $standardDist "YTSage-v$version.exe"
          if (-not (Test-Path $standardExe)) {
            throw "Standard executable not found at $standardExe"
          }
          $stdZip = "artifacts\YTSage-v$version-portable.zip"
          if (Test-Path $stdZip) { Remove-Item $stdZip -Force }
          Compress-Archive -Path "$standardDist\*" -DestinationPath $stdZip -CompressionLevel Optimal
          Write-Host "Created: $(Resolve-Path $stdZip)"
        } else {
          throw "Standard dist folder not found at $standardDist"
        }

        # Create FFmpeg ZIP
        $ffmpegDist = Join-Path (Get-Location) "dist\YTSage-FFmpeg"
        if (Test-Path $ffmpegDist) {
          $ffmpegExe = Join-Path $ffmpegDist "YTSage-v$version-ffmpeg.exe"
          foreach ($requiredFile in @(
            $ffmpegExe,
            (Join-Path $ffmpegDist "ffmpeg.exe"),
            (Join-Path $ffmpegDist "ffprobe.exe")
          )) {
            if (-not (Test-Path $requiredFile)) {
              throw "FFmpeg distribution file not found at $requiredFile"
            }
          }
          $ffZip = "artifacts\YTSage-v$version-ffmpeg-portable.zip"
          if (Test-Path $ffZip) { Remove-Item $ffZip -Force }
          Compress-Archive -Path "$ffmpegDist\*" -DestinationPath $ffZip -CompressionLevel Optimal
          Write-Host "Created: $(Resolve-Path $ffZip)"
        } else {
          throw "FFmpeg dist folder not found at $ffmpegDist"
        }

        # List all artifacts
        Write-Host "Final artifacts:"
        if (Test-Path "artifacts") {
          $artifactFiles = Get-ChildItem artifacts
          if (-not $artifactFiles) {
            throw "No artifacts were created."
          }
          $artifactFiles | ForEach-Object { Write-Host "  $($_.Name)" }
        } else {
          throw "Artifacts directory not found."
        }

    - name: Create Installer (Inno Setup)
      shell: powershell
      run: |
        $version = "${{ steps.get_version.outputs.VERSION }}"

        # Install Inno Setup
        choco install innosetup --no-progress

        # Add matches generally C:\Program Files (x86)\Inno Setup 6
        $env:Path = "C:\Program Files (x86)\Inno Setup 6;$env:Path"

        # Compile
        $exeName = "YTSage-v$version.exe"
        $installedExeName = "YTSage.exe"
        Write-Host "Compiling installer for $exeName as $installedExeName..."

        # Note: Setup-windows.iss is in setup-scripts/
        # OutputDir is ..\artifacts (relative to script) -> repo/artifacts
        # SourceDir is ..\dist\YTSage (relative to script) -> repo/dist/YTSage

        iscc /DMyAppVersion="$version" /DMyAppExeName="$installedExeName" /DMyAppSourceExeName="$exeName" /DSourceDir="..\dist\YTSage" "setup-scripts\Setup-windows.iss"
        if ($LASTEXITCODE -ne 0) {
          throw "Standard installer compilation failed."
        }

        # Compile FFmpeg Installer
        $exeNameFFmpeg = "YTSage-v$version-ffmpeg.exe"
        $installedExeNameFFmpeg = "YTSage-ffmpeg.exe"
        Write-Host "Compiling FFmpeg installer for $exeNameFFmpeg as $installedExeNameFFmpeg..."
        iscc /DMyAppVersion="$version" /DMyAppExeName="$installedExeNameFFmpeg" /DMyAppSourceExeName="$exeNameFFmpeg" /DSourceDir="..\dist\YTSage-FFmpeg" "setup-scripts\Setup-windows-ffmpeg.iss"
        if ($LASTEXITCODE -ne 0) {
          throw "FFmpeg installer compilation failed."
        }
        Write-Host "Installer compilation successful."

        $expectedArtifacts = @(
          "YTSage-v$version-portable.zip",
          "YTSage-v$version-ffmpeg-portable.zip",
          "YTSage-v$version-Setup.exe",
          "YTSage-v$version-ffmpeg-Setup.exe"
        )
        foreach ($artifact in $expectedArtifacts) {
          if (-not (Test-Path (Join-Path "artifacts" $artifact))) {
            throw "Expected release artifact was not created: $artifact"
          }
        }

    - name: Create draft release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: YTSage v${{ steps.get_version.outputs.VERSION }}
        draft: true
        prerelease: false
        body: |
          # YTSage v${{ steps.get_version.outputs.VERSION }}

          **Release Date**: ${{ github.run_started_at }}
        files: |
          artifacts/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}